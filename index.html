<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Demo</title>
  <style>
    body {
      margin: 0
    }

    #ui {
      position: absolute;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      width: fit-content;
    }

    .toggle {
      width: fit-content;
      cursor: pointer;
      font-size: 20px;
      background: #eee;
      padding: 4px;
    }

    .toggle.pressed {
      transform: translateY(2px);
      font-size: 20px;
      background: #555;
    }

    .selector {
      width: fit-content;
      cursor: pointer;
      font-size: 20px;
      background: #eee;
      padding: 4px;
    }

    .label {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "three": "/node_modules/three/build/three.module.js",
    "three/examples/jsm/": "/node_modules/three/examples/jsm/",
    "three-mesh-bvh": "/node_modules/three-mesh-bvh/build/index.module.js"
  }
}
</script>
</head>

<body>
  <script type="module" src="main.js"></script>
  <div id="ui">
    <button id="cosineWeighted" class="toggle">CosineWeighted</button>
  </div>
</body>

</html>
